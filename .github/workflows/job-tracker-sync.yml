name: Job tracker sync

on:
  push:
    branches:
      - main
    paths:
      - tracker-sync-queue.json
      - .github/workflows/job-tracker-sync.yml
      - .github/scripts/job_tracker_sync.py

permissions:
  contents: write

concurrency:
  group: job-tracker-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply tracker queue safely
        run: python .github/scripts/job_tracker_sync.py

      - name: Commit tracker update
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          MESSAGE=$(python -c 'import json; print(json.load(open("tracker-sync-queue.json", encoding="utf-8")).get("commitMessage", "Job tracker: apply sync queue"))')
          git commit -m "$MESSAGE"
          git push origin HEAD:main
