name: Publish missing CV links

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/generate_missing_cv_links.py'
      - '.github/workflows/publish-missing-cv-links.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate missing CV PDFs
        run: python .github/scripts/generate_missing_cv_links.py
      - name: Commit generated PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Applications/*.pdf
          if git diff --cached --quiet; then
            echo "No CV PDF changes to commit"
            exit 0
          fi
          git commit -m "Publish missing tracker CV PDFs"
          git push
